name: tacoguard
description: TacoGuard - controle da jornada do motorista pela lei do tacógrafo (CE 561/2006).
publish_to: 'none'
version: 1.9.7+41

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  flutter_tts: ^4.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_overlay_window: ^1.0.2
  android_intent_plus: '>=5.0.0 <7.0.0'
  path_provider: ^2.1.4
  share_plus: ^11.0.0
  file_picker: '>=8.1.0 <11.0.0'
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash.jpg
    - assets/icon.png
